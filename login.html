<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Portal</title>
    <style>
        :root {
            --bg-body: #f4f7f6;
            --bg-container: #ffffff;
            --text-main: #333333;
            --text-sub: #666666;
            --border-color: #cccccc;
            --btn-social-bg: #ffffff;
            --btn-social-hover: #f8f9fa;
        }

        [data-theme="dark"] {
            --bg-body: #121212;
            --bg-container: #1e1e1e;
            --text-main: #e0e0e0;
            --text-sub: #a0a0a0;
            --border-color: #444444;
            --btn-social-bg: #2a2a2a;
            --btn-social-hover: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-body);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background-color 0.3s ease;
            position: relative;
        }

        .theme-toggle-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: var(--bg-container);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .auth-container {
            background-color: var(--bg-container);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        h2 {
            margin-bottom: 24px;
            color: var(--text-main);
            text-align: center;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-sub);
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-container);
            color: var(--text-main);
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .input-group input:focus {
            border-color: #007bff;
            outline: none;
        }

        .auth-btn {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .auth-btn:hover { background-color: #0056b3; }
        .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .divider {
            text-align: center;
            margin: 20px 0;
            color: var(--text-sub);
            font-size: 14px;
        }

        .social-btn {
            width: 100%;
            padding: 11px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background-color: var(--btn-social-bg);
            color: var(--text-main);
            transition: background-color 0.2s ease;
        }

        .social-btn:hover { background-color: var(--btn-social-hover); }
        .social-btn svg { width: 18px; height: 18px; }

        .toggle-text {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-sub);
        }

        .toggle-text a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        .error-msg {
            display: none;
            background-color: rgba(220, 53, 69, 0.1);
            color: #dc3545;
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .error-msg.show { display: block; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <button class="theme-toggle-btn" id="themeToggle">
        <span id="themeIcon">🌙</span> <span id="themeText">Dark Mode</span>
    </button>

    <div class="auth-container">
        <div id="loginSection">
            <h2>Account Login</h2>
            <div class="error-msg" id="loginError"></div>
            <form id="loginForm">
                <div class="input-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" placeholder="Enter your email" required>
                </div>
                <div class="input-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="auth-btn" id="loginSubmitBtn">Log In</button>
            </form>

            <div class="divider">OR</div>

            <button class="social-btn" id="googleLoginBtn">
                <svg viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                Sign in with Google
            </button>

            <button class="social-btn" id="microsoftLoginBtn">
                <svg viewBox="0 0 23 23">
                    <path fill="#f35325" d="M0 0h11v11H0z"/>
                    <path fill="#81bc06" d="M12 0h11v11H12z"/>
                    <path fill="#00a4ef" d="M0 12h11v11H0z"/>
                    <path fill="#ffb900" d="M12 12h11v11H12z"/>
                </svg>
                Sign in with Microsoft
            </button>

            <p class="toggle-text">Don't have an account? <a id="toRegister">Sign up</a></p>
        </div>

        <div id="registerSection" class="hidden">
            <h2>Create Account</h2>
            <div class="error-msg" id="registerError"></div>
            <form id="registerForm">
                <div class="input-group">
                    <label for="registerEmail">Email Address</label>
                    <input type="email" id="registerEmail" placeholder="Choose an email" required>
                </div>
                <div class="input-group">
                    <label for="registerPassword">Password</label>
                    <input type="password" id="registerPassword" placeholder="Choose a secure password (6+ characters)" required minlength="6">
                </div>
                <button type="submit" class="auth-btn" id="registerSubmitBtn">Register</button>
            </form>

            <div class="divider">OR</div>

            <button class="social-btn" id="googleRegisterBtn">
                <svg viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                Sign up with Google
            </button>

            <button class="social-btn" id="microsoftRegisterBtn">
                <svg viewBox="0 0 23 23">
                    <path fill="#f35325" d="M0 0h11v11H0z"/>
                    <path fill="#81bc06" d="M12 0h11v11H12z"/>
                    <path fill="#00a4ef" d="M0 12h11v11H0z"/>
                    <path fill="#ffb900" d="M12 12h11v11H12z"/>
                </svg>
                Sign up with Microsoft
            </button>

            <p class="toggle-text">Already have an account? <a id="toLogin">Log In</a></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-analytics.js";
        import {
            getAuth,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            GoogleAuthProvider,
            OAuthProvider,
            signInWithRedirect,
            getRedirectResult
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import {
            getFirestore,
            doc,
            setDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        // Your project configuration snippet
        const firebaseConfig = {
            apiKey: "AIzaSyA0jc64vq-l9ngcxw1wm4iE8EZluqaL3jw",
            authDomain: "maptitan-auth.firebaseapp.com",
            projectId: "maptitan-auth",
            storageBucket: "maptitan-auth.firebasestorage.app",
            messagingSenderId: "303640467724",
            appId: "1:303640467724:web:a1c048cbb835dff8dc1129",
            measurementId: "G-WTFHY9DZ56"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const googleProvider = new GoogleAuthProvider();
        const microsoftProvider = new OAuthProvider('microsoft.com');

        // EDIT THIS: set to your real site URL
        const REDIRECT_URL = "https://axilabs.wuaze.com/";

        async function saveUserProfile(user) {
            try {
                await setDoc(doc(db, 'users', user.uid), {
                    email: user.email || null,
                    displayName: user.displayName || null,
                    lastSignIn: serverTimestamp()
                }, { merge: true });
            } catch (e) {
                console.error('Failed to save user profile:', e);
            }
        }

        function friendlyError(code) {
            const map = {
                'auth/email-already-in-use': 'That email is already registered — try logging in instead.',
                'auth/invalid-email': 'That email address looks invalid.',
                'auth/weak-password': 'Password should be at least 6 characters.',
                'auth/user-not-found': 'No account found with that email.',
                'auth/wrong-password': 'Incorrect password.',
                'auth/invalid-credential': 'Incorrect email or password.',
                'auth/popup-closed-by-user': 'Sign-in window was closed before finishing.',
                'auth/account-exists-with-different-credential': 'This email is linked to a different sign-in method.'
            };
            return map[code] || ('Error: ' + code);
        }

        // Check if we just came back from a Google/Microsoft redirect sign-in
        getRedirectResult(auth)
            .then((result) => {
                if (result && result.user) {
                    return saveUserProfile(result.user).then(() => {
                        window.location.href = REDIRECT_URL;
                    });
                }
            })
            .catch((err) => {
                console.error('Redirect sign-in error:', err.code, err.message);
            });

        document.addEventListener("DOMContentLoaded", () => {

            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            const themeText = document.getElementById('themeText');

            themeToggle.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                if (currentTheme === 'dark') {
                    document.documentElement.removeAttribute('data-theme');
                    themeIcon.innerText = '🌙';
                    themeText.innerText = 'Dark Mode';
                } else {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    themeIcon.innerText = '☀️';
                    themeText.innerText = 'Light Mode';
                }
            });

            const loginSection = document.getElementById('loginSection');
            const registerSection = document.getElementById('registerSection');
            document.getElementById('toRegister').addEventListener('click', () => {
                loginSection.classList.add('hidden');
                registerSection.classList.remove('hidden');
            });
            document.getElementById('toLogin').addEventListener('click', () => {
                registerSection.classList.add('hidden');
                loginSection.classList.remove('hidden');
            });

            const handleRedirect = () => {
                window.location.href = REDIRECT_URL;
            };

            const loginErrorBox = document.getElementById('loginError');
            const registerErrorBox = document.getElementById('registerError');
            const loginSubmitBtn = document.getElementById('loginSubmitBtn');
            const registerSubmitBtn = document.getElementById('registerSubmitBtn');

            function showError(box, text) {
                box.textContent = text;
                box.classList.add('show');
            }
            function clearError(box) {
                box.textContent = '';
                box.classList.remove('show');
            }

            document.getElementById('loginForm').addEventListener('submit', (e) => {
                e.preventDefault();
                clearError(loginErrorBox);
                loginSubmitBtn.disabled = true;
                signInWithEmailAndPassword(auth, document.getElementById('loginEmail').value, document.getElementById('loginPassword').value)
                    .then((cred) => saveUserProfile(cred.user))
                    .then(handleRedirect)
                    .catch((err) => showError(loginErrorBox, friendlyError(err.code)))
                    .finally(() => { loginSubmitBtn.disabled = false; });
            });

            document.getElementById('registerForm').addEventListener('submit', (e) => {
                e.preventDefault();
                clearError(registerErrorBox);
                registerSubmitBtn.disabled = true;
                createUserWithEmailAndPassword(auth, document.getElementById('registerEmail').value, document.getElementById('registerPassword').value)
                    .then((cred) => saveUserProfile(cred.user))
                    .then(handleRedirect)
                    .catch((err) => showError(registerErrorBox, friendlyError(err.code)))
                    .finally(() => { registerSubmitBtn.disabled = false; });
            });

            document.getElementById('googleLoginBtn').addEventListener('click', () => {
                clearError(loginErrorBox);
                signInWithRedirect(auth, googleProvider);
            });

            document.getElementById('microsoftLoginBtn').addEventListener('click', () => {
                clearError(loginErrorBox);
                signInWithRedirect(auth, microsoftProvider);
            });

            document.getElementById('googleRegisterBtn').addEventListener('click', () => {
                clearError(registerErrorBox);
                signInWithRedirect(auth, googleProvider);
            });

            document.getElementById('microsoftRegisterBtn').addEventListener('click', () => {
                clearError(registerErrorBox);
                signInWithRedirect(auth, microsoftProvider);
            });
        });
    </script>
<!-- AXI Labs reCAPTCHA v3 (host-guarded background check) -->
<script src="axi-recaptcha.js" defer></script>
</body>
</html>
